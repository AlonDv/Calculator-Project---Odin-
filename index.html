<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@300..700&family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Josefin+Sans:ital,wght@0,100..700;1,100..700&family=Montserrat:ital,wght@0,100..900;1,100..900&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&family=Press+Start+2P&family=Roboto+Mono:ital,wght@0,100..700;1,100..700&family=Roboto:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
    <script src="https://kit.fontawesome.com/42f5a0dea4.js" crossorigin="anonymous"></script>
    <link rel="stylesheet" href="styles.css">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <div class="container">
        <div class="display">40%</div>
        <div class="buttons">
        <div class="row">
            <button class="purpleBtn" id="clearBtn">C</button>
            <button class="redBtn" value="^">^</button>
            <button class="purpleBtn"><i class="fa-solid fa-delete-left" id="deleteBtn"></i></button>
            <button class="redBtn" value = "/"><i class="fa-solid fa-divide"></i></button>
        </div>
        <div class="row">
            <button class="numBtn" value="7">7</button>
            <button class="numBtn" value="8">8</button>
            <button class="numBtn" value="9">9</button>
            <button class="redBtn" value="*">X</button>
        </div>
        <div class="row">
            <button class="numBtn" value="4">4</button>
            <button class="numBtn" value="5">5</button>
            <button class="numBtn" value="6">6</button>
            <button class="redBtn" value="-">-</button>
        </div>
        <div class="row">
            <button class="numBtn" value="1">1</button>
            <button class="numBtn" value="2">2</button>
            <button class="numBtn" value="3">3</button>
            <button class="redBtn" value="+">+</button>
        </div>
        <div class="row">
            <button class="numBtn" id="zeroBtn" value="0">0</button>
            <button class="numBtn" value=".">.</button>
            <button class="redBtn" id="equalBtn">=</button>
        </div>
        

    </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
